<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Arlo Base Station{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">A</span>
        <span>Arlo Base Station</span>
      </a>
      <a class="button primary" href="/pair">+ Add camera</a>
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
